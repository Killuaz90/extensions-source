name: Build Black Lagoon
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :src:en:blacklagoon:assembleDebug -x spotlessKotlinCheck
      - uses: actions/upload-artifact@v4
        with:
          name: blacklagoon-apk
          path: src/en/blacklagoon/build/outputs/apk/debug/*.apk
